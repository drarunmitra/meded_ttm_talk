<style>
/* ggplot2-deconstructed styles, from Emil Hvitfeldt's tidy-animations
   demos.css. Only the .gd2-* block is kept; #gd2-stage / #gd2-plot are
   classes here so more than one stage can live in a deck. */
:root { --tm-ink: #22303c; }

section:has(.gd2-slide) { overflow: hidden; }

.gd2-stage-wrap { position: relative; margin-top: 10px; }

.gd2-stage {
  position: relative;
  width: 1200px;
  height: 600px;
  margin: 0 auto;
}

.gd2-frag {
  position: absolute;
  pointer-events: none;
  opacity: 0 !important;
}

.gd2-code {
  position: absolute;
  left: 0;
  top: 150px;
  width: 590px;
  font-family: "Source Code Pro", "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 17px;
  line-height: 1.65;
  color: var(--tm-ink);
  white-space: pre;
}
.gd2-code [data-blk] { border-radius: 4px; transition: background-color 0.3s ease; }
.gd2-code [data-blk].gd2-hot {
  background: rgba(255, 214, 84, 0.32);
  box-shadow: 0 0 0 4px rgba(255, 214, 84, 0.32);
}

.gd2-code .gd2-fn   { color: #2563c9; }
.gd2-code .gd2-str  { color: #2e8b57; }
.gd2-code .gd2-arg  { color: #8a6d00; }
.gd2-code .gd2-num  { color: #b5651d; }
.gd2-code .gd2-mut  { color: #9aa1ad; }

.gd2-plot {
  position: absolute;
  left: 600px;
  top: 110px;
  width: 600px;
  height: 380px;
}

.gd2-plane { perspective: 1600px; }

.gd2-tilt {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}

.gd2-card {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.62);
  border: 1px solid rgba(160, 168, 184, 0.6);
  border-radius: 6px;
  box-shadow: 0 14px 34px rgba(20, 28, 45, 0.14);
  opacity: 0;
}
</style>
